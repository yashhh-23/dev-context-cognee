[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-context"
version = "0.1.0"
description = "CLI for dev-context-cognee memory management"
dependencies = [
    "requests",
    "typer",
    "rich",
    "fastapi>=0.109.2",
    "uvicorn[standard]",
    "python-dotenv",
    "pydantic",
    "pydantic-settings",
    "fastapi-users[sqlalchemy]",
    "cognee==1.2.1",
    "sqlalchemy",
    "alembic",
    "aiosqlite",
    "psycopg2-binary>=2.9.9",
    "httpx",
    "aiohttp",
    "PyGithub",
    "watchdog",
    "watchfiles",
    "tenacity",
    "python-multipart",
    "numpy",
    "filelock",
    "websockets",
    "cryptography>=42.0.5",
    "fastmcp",
    "python-dateutil"
]

[project.scripts]
dev-context = "cli.cognee_cli:app"

[tool.setuptools]
packages = ["cli"]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.pyright]
extraPaths = ["backend"]
